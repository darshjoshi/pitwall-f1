[project]
name = "pitwall-f1"
version = "1.0.0"
description = "Claude plugin: F1 race engineer with 77 read-only MCP tools for telemetry, strategy, live timing, and 75 years of results."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Darsh Joshi", email = "contact@darshjoshi.com" },
]
dependencies = [
    # <2 is load-bearing: mcp 2.0 removed mcp.server.fastmcp, which every tool here is built on.
    # >=1.10 is needed for tool titles + annotations (readOnlyHint etc.).
    "mcp>=1.10.0,<2",
    "requests>=2.28.0",
    "websockets>=13.0",
    "aiohttp>=3.9.0",
    "certifi",
    "fastf1>=3.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/darshjoshi/pitwall-f1"
Repository = "https://github.com/darshjoshi/pitwall-f1"
Issues = "https://github.com/darshjoshi/pitwall-f1/issues"

[tool.uv]
# Not a distributable package: the plugin runs pitwall.py directly with `uv run --locked`.
package = false
